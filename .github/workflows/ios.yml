name: App iPhone

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: xcodebuild -version

      - name: Générer le projet Xcode
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compiler (sans signature)
        working-directory: ios
        run: |
          xcodebuild -project DanseReveil.xcodeproj -scheme DanseReveil \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Créer le fichier .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DanseReveil.app Payload/
          zip -qry DanseReveil.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DanseReveil-ipa
          path: ios/DanseReveil.ipa
